{% extends "layout.html" %} {% block title %}Edit Habit{% endblock %} {%
block main %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="card-title mb-4">Edit Habit</h2>

        <form action="/habits/{{ habit.id }}/edit" method="post">
          <div class="mb-3">
            <label for="name" class="form-label">Habit Name</label>
            <input
              type="text"
              class="form-control"
              id="name"
              name="name"
              value="{{ habit.name }}"
              placeholder="Ex: Beber 2L de água"
            />
          </div>

          <div class="mb-3">
            <label for="description" class="form-label"
              >Description (optional)</label
            >
            <textarea
              class="form-control"
              id="description"
              name="description"
              rows="3"
              placeholder="Details about the habit"
            >
              {{ habit.description or '' }}</textarea
            >
          </div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-grow-1">
              <i class="bi bi-check-lg"></i> Salvar Changes
            </button>
            <a href="/habits" class="btn btn-secondary">
              <i class="bi bi-x-lg"></i> Cancelar
            </a>
          </div>
        </form>
      </div>
    </div>

    <div class="mt-3 text-center">
      <small class="text-muted"> Created at {{ habit.created_at }} </small>
    </div>
  </div>
</div>
{% endblock %}
